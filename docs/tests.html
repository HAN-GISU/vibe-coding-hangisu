<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>reset.js 테스트</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* 개발용 검증 페이지. 앱 화면이 아니다. 색은 css/style.css의 변수만 쓴다. */
    .page { max-width: 960px; margin: 0 auto; padding: var(--page-padding); }
    h1 { margin: 0 0 4px; font-size: 24px; font-weight: 600; }
    .sub { margin: 0 0 16px; color: var(--muted-foreground); }
    .summary { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 16px 0; padding: 16px 20px;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-card); }
    .summary .big { font-size: 20px; font-weight: 600; }
    .badge { display: inline-flex; align-items: center; height: 22px; padding: 0 10px; border: 1px solid var(--border);
      border-radius: 999px; font-size: var(--font-size-small); color: var(--muted-foreground); }
    .badge[hidden] { display: none; }
    .badge.fail { color: var(--destructive); border-color: var(--destructive); }
    .btn { height: var(--control-height); padding: 0 14px; border: 1px solid var(--input); border-radius: calc(var(--radius) - 2px);
      background: var(--secondary); color: var(--secondary-foreground); font: inherit; cursor: pointer; }
    .btn:hover { background: var(--accent); }
    .nowline { color: var(--muted-foreground); font-size: var(--font-size-small); }
    .fatal { padding: 16px 20px; border: 1px solid var(--destructive); border-radius: var(--radius-card); color: var(--destructive); }
    details.suite { margin: 8px 0; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-card); }
    details.suite > summary { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; list-style: none; }
    details.suite > summary::-webkit-details-marker { display: none; }
    details.suite > summary:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; border-radius: var(--radius-card); }
    .suite-name { font-weight: 600; }
    ul.cases { margin: 0; padding: 0 16px 12px; list-style: none; }
    ul.cases li { padding: 4px 0; }
    .mark { display: inline-block; width: 1.4em; }
    li.fail { color: var(--destructive); }
    li.fail pre { margin: 6px 0 4px 1.4em; padding: 8px 12px; background: var(--background); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--foreground); white-space: pre-wrap; word-break: break-all; font-size: 12.5px; }
    li.pass { color: var(--muted-foreground); }
    @media (max-width: 600px) { .page { padding: 16px; } }
  </style>
</head>
<body>
<main class="page">
  <h1>reset.js 테스트</h1>
  <p class="sub">개발용 검증 페이지입니다(앱 화면이 아닙니다). 시각은 한국 시간대 기준이고, 테스트는 시각을 직접 넘기므로 <code>?now=</code>의 영향을 받지 않습니다.</p>
  <div class="summary" id="summary" aria-live="polite">
    <span class="big" id="sum-text">실행 중…</span>
    <span class="badge" id="sum-fail" hidden></span>
    <button class="btn" id="rerun" type="button">다시 실행</button>
    <span class="nowline" id="nowline"></span>
  </div>
  <div id="out"></div>
</main>

<script src="../js/reset.js"></script>
<script>
(function () {
  'use strict';
  var out = document.getElementById('out');
  var R = window.Reset;
  if (!R) {
    out.innerHTML = '<div class="fatal">reset.js를 불러오지 못했습니다. 경로(../js/reset.js)를 확인해 주세요.</div>';
    document.getElementById('sum-text').textContent = '실행하지 못했습니다';
    window.__testResult = { total: 0, passed: 0, failed: 1, failures: ['reset.js 로드 실패'] };
    return;
  }

  /* ---------- 작은 테스트 도구 ---------- */
  var suites = [];
  var cur = null;
  function suite(name, fn) { suites.push({ name: name, fn: fn }); }

  function fmtDate(d) {
    function p(n) { return String(n).length < 2 ? '0' + n : String(n); }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) +
      ':' + p(d.getSeconds()) + (d.getMilliseconds() ? '.' + d.getMilliseconds() : '');
  }
  function show(v) {
    if (v === undefined) return 'undefined';
    if (v === Infinity) return 'Infinity';
    try {
      return JSON.stringify(v, function (k, x) {
        var raw = this[k];
        if (raw instanceof Date) return fmtDate(raw);
        if (raw === Infinity) return 'Infinity';
        return x;
      }, 1);
    } catch (e) { return String(v); }
  }
  function same(a, b) {
    if (a instanceof Date || b instanceof Date) return a instanceof Date && b instanceof Date && a.getTime() === b.getTime();
    if (a === null || b === null || typeof a !== 'object' || typeof b !== 'object') return a === b || (a !== a && b !== b);
    if (Array.isArray(a) !== Array.isArray(b)) return false;
    var ka = Object.keys(a), kb = Object.keys(b);
    if (ka.length !== kb.length) return false;
    return ka.every(function (k) { return Object.prototype.hasOwnProperty.call(b, k) && same(a[k], b[k]); });
  }
  // expected에 적힌 키만 비교한다.
  function covers(a, b) {
    if (b instanceof Date || a instanceof Date) return same(a, b);
    if (b === null || typeof b !== 'object' || a === null || typeof a !== 'object') return a === b;
    if (Array.isArray(b)) return Array.isArray(a) && a.length === b.length && b.every(function (x, i) { return covers(a[i], x); });
    return Object.keys(b).every(function (k) { return covers(a[k], b[k]); });
  }
  function record(name, pass, actual, expected, err) {
    cur.cases.push({ name: name, pass: pass, actual: actual, expected: expected, err: err });
  }
  function run1(name, thunk, expected, cmp) {
    var actual, err = null;
    try { actual = thunk(); } catch (e) { err = e; }
    record(name, !err && cmp(actual, expected), actual, expected, err);
    cur.cases[cur.cases.length - 1].src = String(thunk); // 같은 입력·같은 기대값의 중복 테스트를 찾을 때 쓴다
  }
  function eq(name, thunk, expected) { run1(name, thunk, expected, same); }
  function has(name, thunk, expected) { run1(name, thunk, expected, covers); }
  function ok(name, thunk) { run1(name, thunk, true, same); }

  /* ---------- 자료 만들기 ---------- */
  function D(m, d, h, mi, s) { return new Date(2026, m - 1, d, h || 0, mi || 0, s || 0); }
  function Y(y, m, d, h, mi) { return new Date(y, m - 1, d, h || 0, mi || 0); }
  function M(d, h, m, s) { return (((d * 24 + h) * 60 + m) * 60 + (s || 0)) * 1000; }
  function rec(taskId, folderId, at) { return { taskId: taskId, folderId: folderId, doneAt: R.formatIso(at) }; }
  function grec(groupId, folderId, at) { return { groupId: groupId, folderId: folderId, doneAt: R.formatIso(at) }; }
  function lastNext(c, at) { return [R.lastReset(c, at), R.nextReset(c, at)]; }
  function task(id, groupId, created) { return { id: id, groupId: groupId, name: id, low: false, createdAt: created || '2026-10-01T00:00' }; }
  function deepFreeze(o) {
    if (o && typeof o === 'object' && !Object.isFrozen(o)) { Object.freeze(o); Object.keys(o).forEach(function (k) { deepFreeze(o[k]); }); }
    return o;
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  var daily5 = { id: 'd5', type: 'daily', time: '05:00' };
  var weeklyThu6 = { id: 'wt6', type: 'weekly', day: 4, time: '06:00' };
  var weeklyMon5 = { id: 'wm5', type: 'weekly', day: 1, time: '05:00' };
  var monthly1 = { id: 'm1', type: 'monthly', date: 1, time: '00:00' };

  /* ---------- 시각 읽기·쓰기, now(), ?now= ---------- */
  suite('시각 읽기·쓰기 (parseTime, formatIso)', function () {
    eq('"2026-10-15T05:00"은 로컬 시각', function () { return R.parseTime('2026-10-15T05:00'); }, D(10, 15, 5, 0));
    eq('초와 밀리초를 읽는다', function () { return R.parseTime('2026-10-15T05:00:07.250'); }, new Date(2026, 9, 15, 5, 0, 7, 250));
    eq('Z가 붙은 시각은 그 순간으로 읽는다', function () { return R.parseTime('2026-10-14T20:00:00Z'); }, new Date(Date.UTC(2026, 9, 14, 20, 0, 0)));
    eq('+09:00이 붙은 시각은 그 순간으로 읽는다', function () { return R.parseTime('2026-10-15T05:00:00+09:00'); }, new Date(Date.UTC(2026, 9, 14, 20, 0, 0)));
    eq('없는 날짜(2월 30일)는 null', function () { return R.parseTime('2026-02-30T00:00'); }, null);
    eq('Z가 붙어도 없는 날짜(2월 30일)는 null', function () { return R.parseTime('2026-02-30T00:00:00Z'); }, null);
    eq('+09:00이 붙어도 없는 날짜(평년 2월 29일)는 null', function () { return R.parseTime('2027-02-29T00:00:00+09:00'); }, null);
    eq('Z가 붙은 25시와 13월은 null', function () { return [R.parseTime('2026-10-15T25:00:00Z'), R.parseTime('2026-13-01T00:00:00Z')]; }, [null, null]);
    eq('윤년 2월 29일은 읽는다 (로컬, Z)', function () { return [R.parseTime('2028-02-29T00:00'), R.parseTime('2028-02-29T00:00:00Z')].map(function (d) { return !!d; }); }, [true, true]);
    eq('13월은 null', function () { return R.parseTime('2026-13-01T00:00'); }, null);
    eq('25시는 null', function () { return R.parseTime('2026-10-15T25:00'); }, null);
    eq('초 60은 null (다음 분으로 넘어가지 않는다)', function () { return R.parseTime('2026-10-15T05:00:60'); }, null);
    eq('글자는 null', function () { return R.parseTime('abc'); }, null);
    eq('null은 null', function () { return R.parseTime(null); }, null);
    ok('Date를 주면 같은 시각의 다른 객체(복사본)를 돌려준다', function () { var src = D(10, 15, 5, 0); var out = R.parseTime(src); return out !== src && out.getTime() === src.getTime(); });
    eq('formatIso: 초까지', function () { return R.formatIso(D(10, 15, 5, 0)); }, '2026-10-15T05:00:00');
    eq('formatIso: 밀리초가 있으면 붙인다', function () { return R.formatIso(new Date(2026, 9, 15, 5, 0, 0, 250)); }, '2026-10-15T05:00:00.250');
    eq('formatIso → parseTime 왕복', function () { var d = new Date(2026, 9, 15, 5, 3, 7, 9); return R.parseTime(R.formatIso(d)); }, new Date(2026, 9, 15, 5, 3, 7, 9));
  });

  suite('now() 와 ?now=', function () {
    eq('?now= 읽기', function () { return R.parseNowParam('?now=2026-10-15T05:59'); }, D(10, 15, 5, 59));
    eq('초가 있어도 읽는다', function () { return R.parseNowParam('?now=2026-10-15T05:59:30'); }, D(10, 15, 5, 59, 30));
    eq('다른 값과 섞여도 읽는다', function () { return R.parseNowParam('?x=1&now=2026-10-15T05:59'); }, D(10, 15, 5, 59));
    eq('콜론이 %3A로 인코딩돼도 읽는다', function () { return R.parseNowParam('?now=2026-10-15T05%3A59'); }, D(10, 15, 5, 59));
    eq('now가 없으면 null', function () { return R.parseNowParam('?foo=1'); }, null);
    eq('빈 문자열은 null', function () { return R.parseNowParam(''); }, null);
    eq('글자는 null', function () { return R.parseNowParam('?now=abc'); }, null);
    eq('없는 날짜는 null', function () { return R.parseNowParam('?now=2026-02-30T00:00'); }, null);
    eq('날짜만 있으면 null', function () { return R.parseNowParam('?now=2026-10-15'); }, null);
    eq('Z가 붙은 값은 null (로컬 시각만 받는다)', function () { return R.parseNowParam('?now=2026-10-15T05:59:00Z'); }, null);
    eq('다른 값 안에 들어 있는 "?now="는 now가 아니다', function () { return R.parseNowParam('?other=?now=2026-10-15T05:59'); }, null);
    eq('now가 두 번이면 첫 값을 쓴다', function () { return R.parseNowParam('?now=2026-10-15T05:59&now=2026-10-16T05:59'); }, D(10, 15, 5, 59));
    var t0 = 1000000;
    var clock = R.makeClock(D(10, 15, 5, 59), t0);
    eq('시계: 시작 시각 그대로', function () { return clock(t0); }, D(10, 15, 5, 59));
    eq('시계: 90초 뒤는 06:00:30 (시간이 흐른다)', function () { return clock(t0 + 90000); }, D(10, 15, 6, 0, 30));
    eq('시계: 04:59:58에서 시작해 1초 뒤에는 리셋 전, 2초 뒤에는 리셋 후', function () {
      var c = R.makeClock(D(10, 15, 4, 59, 58), t0);
      return [R.lastReset(daily5, c(t0 + 1000)), R.lastReset(daily5, c(t0 + 2000))];
    }, [D(10, 14, 5, 0), D(10, 15, 5, 0)]);
    var src = R.makeNowSource('?now=2026-10-15T05:59:50', t0);
    has('원천: ?now=가 있으면 테스트 모드, 시작 시각과 오류 없음', function () { return { isTest: src.isTest, startedAt: src.startedAt, error: src.error }; }, { isTest: true, startedAt: D(10, 15, 5, 59, 50), error: null });
    eq('원천: 시작 시각에서 시작한다', function () { return src.at(t0); }, D(10, 15, 5, 59, 50));
    eq('원천: 12초 뒤 06:00:02 (시간이 흐르고 리셋 시각을 지난다)', function () { return src.at(t0 + 12000); }, D(10, 15, 6, 0, 2));
    eq('원천: 12초 뒤 매주 목 06:00의 최근 리셋이 10/08에서 10/15로 바뀐다', function () { return [R.lastReset(weeklyThu6, src.at(t0)), R.lastReset(weeklyThu6, src.at(t0 + 12000))]; }, [D(10, 8, 6, 0), D(10, 15, 6, 0)]);
    eq('원천: query는 그 순간의 가상 시각', function () { return [src.query(t0), src.query(t0 + 12000)]; }, ['?now=2026-10-15T05:59:50', '?now=2026-10-15T06:00:02']);
    eq('원천: query를 다시 읽으면 같은 시각', function () { return R.parseNowParam(src.query(t0 + 12000)); }, D(10, 15, 6, 0, 2));
    has('원천: ?now=가 없으면 실제 시각 그대로, 테스트 아님', function () { var s = R.makeNowSource('', t0); return { isTest: s.isTest, startedAt: s.startedAt, error: s.error, at: s.at(t0 + 5000).getTime(), query: s.query(t0) }; }, { isTest: false, startedAt: null, error: null, at: t0 + 5000, query: '' });
    has('원천: 잘못된 ?now=는 실제 시각을 쓰고 오류 문구를 담는다', function () { var s = R.makeNowSource('?now=abc', t0); return { isTest: s.isTest, at: s.at(t0).getTime(), hasError: typeof s.error === 'string' && s.error.length > 0 }; }, { isTest: false, at: t0, hasError: true });
    has('원천: 다른 값 안의 "?now="는 테스트 모드가 아니다', function () { var s = R.makeNowSource('?other=?now=2026-10-15T05:59', t0); return { isTest: s.isTest, error: s.error }; }, { isTest: false, error: null });
    ok('now()와 nowInfo()는 Date를 돌려주고 nowInfo에 isTest, startedAt, error가 있다', function () {
      var info = R.nowInfo();
      return R.now() instanceof Date && info.date instanceof Date && 'isTest' in info && 'startedAt' in info && 'error' in info;
    });
  });

  /* ---------- 리셋 주기 5종 ---------- */
  suite('매일 05:00', function () {
    eq('10/15 04:59 → 최근 10/14 05:00, 다음 10/15 05:00', function () { return lastNext(daily5, D(10, 15, 4, 59)); }, [D(10, 14, 5, 0), D(10, 15, 5, 0)]);
    eq('10/15 05:00 정각은 새 기간', function () { return lastNext(daily5, D(10, 15, 5, 0)); }, [D(10, 15, 5, 0), D(10, 16, 5, 0)]);
    eq('10/15 05:01', function () { return R.lastReset(daily5, D(10, 15, 5, 1)); }, D(10, 15, 5, 0));
    eq('04:59:59.999도 아직 이전 기간', function () { return R.lastReset(daily5, new Date(2026, 9, 15, 4, 59, 59, 999)); }, D(10, 14, 5, 0));
    eq('23:59 → 다음 10/16 05:00', function () { return lastNext(daily5, D(10, 15, 23, 59)); }, [D(10, 15, 5, 0), D(10, 16, 5, 0)]);
    eq('다음날 00:00 → 최근 10/15 05:00', function () { return R.lastReset(daily5, D(10, 16, 0, 0)); }, D(10, 15, 5, 0));
    eq('달 경계: 11/01 04:59 → [10/31 05:00, 11/01 05:00]', function () { return lastNext(daily5, D(11, 1, 4, 59)); }, [D(10, 31, 5, 0), D(11, 1, 5, 0)]);
    eq('해 경계: 2026-12-31 23:59 → 다음 2027-01-01 05:00', function () { return R.nextReset(daily5, Y(2026, 12, 31, 23, 59)); }, Y(2027, 1, 1, 5, 0));
    eq('7장 메이플 일일 00:00: 10/14 23:59 → [10/14 00:00, 10/15 00:00]', function () { return lastNext({ type: 'daily', time: '00:00' }, D(10, 14, 23, 59)); }, [D(10, 14, 0, 0), D(10, 15, 0, 0)]);
    eq('7장 메이플 일일 00:00: 10/15 00:00 정각', function () { return R.lastReset({ type: 'daily', time: '00:00' }, D(10, 15, 0, 0)); }, D(10, 15, 0, 0));
    eq('7장 로스트아크·작혼 일일 06:00: 05:59 / 06:00', function () { var c = { type: 'daily', time: '06:00' }; return [R.lastReset(c, D(10, 15, 5, 59)), R.lastReset(c, D(10, 15, 6, 0))]; }, [D(10, 14, 6, 0), D(10, 15, 6, 0)]);
  });

  suite('매주', function () {
    eq('목 06:00: 10/14(수) 23:59 → [10/08 06:00, 10/15 06:00]', function () { return lastNext(weeklyThu6, D(10, 14, 23, 59)); }, [D(10, 8, 6, 0), D(10, 15, 6, 0)]);
    eq('목 06:00: 10/15(목) 05:59는 아직 이전 기간', function () { return lastNext(weeklyThu6, D(10, 15, 5, 59)); }, [D(10, 8, 6, 0), D(10, 15, 6, 0)]);
    eq('목 06:00: 10/15 06:00 정각', function () { return lastNext(weeklyThu6, D(10, 15, 6, 0)); }, [D(10, 15, 6, 0), D(10, 22, 6, 0)]);
    eq('목 06:00: 10/15 06:01', function () { return R.lastReset(weeklyThu6, D(10, 15, 6, 1)); }, D(10, 15, 6, 0));
    eq('목 06:00: 10/16(금)', function () { return R.lastReset(weeklyThu6, D(10, 16, 12, 0)); }, D(10, 15, 6, 0));
    eq('수 06:00 (로스트아크): 10/14 05:59 → 최근 10/07', function () { return R.lastReset({ type: 'weekly', day: 3, time: '06:00' }, D(10, 14, 5, 59)); }, D(10, 7, 6, 0));
    eq('수 06:00 (로스트아크): 10/14 06:00 정각 → 최근 10/14', function () { return R.lastReset({ type: 'weekly', day: 3, time: '06:00' }, D(10, 14, 6, 0)); }, D(10, 14, 6, 0));
    eq('일(0) 00:00: 10/10(토) 23:59 → 최근 10/04', function () { return R.lastReset({ type: 'weekly', day: 0, time: '00:00' }, D(10, 10, 23, 59)); }, D(10, 4, 0, 0));
    eq('일(0) 00:00: 10/11(일) 00:00 → 최근 10/11', function () { return R.lastReset({ type: 'weekly', day: 0, time: '00:00' }, D(10, 11, 0, 0)); }, D(10, 11, 0, 0));
    eq('7장 메이플 목 00:00: 11/02(월) 00:00 → 최근 10/29 (달 경계)', function () { return R.lastReset({ type: 'weekly', day: 4, time: '00:00' }, D(11, 2, 0, 0)); }, D(10, 29, 0, 0));
    eq('7장 메이플 목 00:00: 10/14 23:59 / 10/15 00:00', function () { var c = { type: 'weekly', day: 4, time: '00:00' }; return [R.lastReset(c, D(10, 14, 23, 59)), R.lastReset(c, D(10, 15, 0, 0))]; }, [D(10, 8, 0, 0), D(10, 15, 0, 0)]);
    eq('월 05:00: 10/12(월) 12:00 → [10/12 05:00, 10/19 05:00]', function () { return lastNext(weeklyMon5, D(10, 12, 12, 0)); }, [D(10, 12, 5, 0), D(10, 19, 5, 0)]);
  });

  suite('매월 (1~28일)', function () {
    eq('매월 1일 00:00: 10/31 23:59 → [10/01, 11/01]', function () { return lastNext(monthly1, D(10, 31, 23, 59)); }, [D(10, 1, 0, 0), D(11, 1, 0, 0)]);
    eq('매월 1일 00:00: 11/01 00:00 정각', function () { return lastNext(monthly1, D(11, 1, 0, 0)); }, [D(11, 1, 0, 0), D(12, 1, 0, 0)]);

      return R.evaluateGroup({ group: gp, tasks: ts, folders: F, folderId: null, records: [rec('T1', null, D(10, 6, 12, 0)), rec('T2', null, D(10, 7, 12, 0))], groupRecords: [], period: P });
    }, { total: 2, need: 2, done: true });
    has('1회 주기 묶음: 지난 기간이 없으니 기록 하나면 완료', function () { return R.evaluateGroup({ group: { id: 'g', scope: 'game', required: null }, cycle: { type: 'once' }, tasks: [task('T1', 'g')], folders: F, folderId: null, records: [rec('T1', null, D(1, 1, 0, 0))], groupRecords: [], at: D(10, 15, 12, 0) }); }, { done: true });
  });

  suite('불변성: 받은 객체를 바꾸지 않는다', function () {
    var cyc = deepFreeze(clone(weeklyThu6));
    var folders = deepFreeze(clone(F));
    var tasks = deepFreeze([task('tA', 'g'), task('tB', 'g')]);
    var records = deepFreeze([rec('tA', 'c1', D(10, 15, 7, 0))]);
    var groupRecords = deepFreeze([grec('g', 'c1', D(10, 15, 7, 0))]);
    var group = deepFreeze({ id: 'g', scope: 2, required: 1 });
    var before = JSON.stringify([cyc, folders, tasks, records, groupRecords, group]);
    ok('evaluateGroup, periodStatus, listPeriods, changeCycle, isOff를 불러도 예외가 없고 내용이 그대로다', function () {
      R.evaluateGroup({ group: group, cycle: cyc, tasks: tasks, folders: folders, folderId: 'c1', records: records, groupRecords: groupRecords, at: D(10, 16, 12, 0) });
      R.periodStatus({ group: group, task: tasks[0], tasks: tasks, folders: folders, folderId: 'c1', records: records, groupRecords: groupRecords, period: R.currentPeriod(cyc, D(10, 16, 12, 0)) });
      R.listPeriods(cyc, '2026-09-30T00:00', D(10, 16, 12, 0));
      R.changeCycle(cyc, { id: 'x', type: 'daily', time: '05:00' }, D(10, 16, 12, 0));
      R.isOff(folders, 'c1', 'tD');
      R.isTaskDone({ cycle: cyc, taskId: 'tA', folderId: 'c1', records: records, at: D(10, 16, 12, 0) });
      return JSON.stringify([cyc, folders, tasks, records, groupRecords, group]) === before;
    });
    eq('리셋 시점을 지나가도(at을 옮겨도) 기록 개수가 줄지 않는다', function () {
      var lens = [D(10, 15, 12, 0), D(10, 22, 5, 59), D(10, 22, 6, 0), D(10, 29, 12, 0)].map(function (at) {
        R.isTaskDone({ cycle: cyc, taskId: 'tA', folderId: 'c1', records: records, at: at });
        return records.length;
      });
      return lens;
    }, [1, 1, 1, 1]);
  });

  /* ---------- 남은 기간 표시 ---------- */
  suite('남은 기간 (remainingMs, describeRemaining)', function () {
    eq('매일 05:00, 10/15 04:59 → 60000ms', function () { return R.remainingMs(daily5, D(10, 15, 4, 59)); }, 60000);
    eq('매일 05:00, 10/15 05:00 → 24시간', function () { return R.remainingMs(daily5, D(10, 15, 5, 0)); }, M(1, 0, 0, 0));
    has('describeRemaining: 04:59에는 "1분"', function () { return R.describeRemaining(daily5, D(10, 15, 4, 59)); }, { text: '1분', kind: 'minutes', untilText: '리셋까지 1분', changeInMs: 1 });
    has('describeRemaining: 04:59:18에는 "42초", 같은 초 묶음 S42', function () { return R.describeRemaining(daily5, D(10, 15, 4, 59, 18)); }, { text: '42초', kind: 'seconds', bucket: { key: 'S42', label: '42초' } });
    has('describeRemaining: 1회는 "기한 없음"이고 바뀌는 시점도 정렬 값도 Infinity', function () { return R.describeRemaining({ type: 'once' }, D(10, 15, 4, 59)); }, { ms: null, text: '기한 없음', untilText: '기한 없음', kind: 'none', changeInMs: Infinity, bucket: { key: 'none', sortMs: Infinity } });
  });

  suite('남은 기간 표시 (formatRemaining)', function () {
    function f(ms) { var r = R.formatRemaining(ms); return [r.kind, r.label, r.text]; }
    eq('48시간 1분 → D-2', function () { return f(M(2, 0, 1, 0)); }, ['dday', 'D-2', 'D-2 · 2일']);
    has('2일 20시간 → D-2 · 2일 20시간 (n, detail 포함)', function () { return R.formatRemaining(M(2, 20, 0, 0)); }, { kind: 'dday', n: 2, label: 'D-2', detail: '2일 20시간', text: 'D-2 · 2일 20시간' });
    eq('3일 5시간 → D-3', function () { return f(M(3, 5, 0, 0)); }, ['dday', 'D-3', 'D-3 · 3일 5시간']);
    eq('정확히 48시간 → D-2', function () { return f(M(2, 0, 0, 0)); }, ['dday', 'D-2', 'D-2 · 2일']);
    eq('47시간 59분 → 47시간 59분', function () { return f(M(1, 23, 59, 0)); }, ['hours', '47시간 59분', '47시간 59분']);
    eq('47시간 59분 59초도 47시간 59분 (초는 버린다)', function () { return f(M(1, 23, 59, 59)); }, ['hours', '47시간 59분', '47시간 59분']);
    eq('35시간 10분', function () { return f(M(1, 11, 10, 0)); }, ['hours', '35시간 10분', '35시간 10분']);
    eq('정확히 24시간 → 24시간', function () { return f(M(1, 0, 0, 0)); }, ['hours', '24시간', '24시간']);
    eq('5시간 12분', function () { return f(M(0, 5, 12, 0)); }, ['hours', '5시간 12분', '5시간 12분']);
    eq('1시간 → 1시간', function () { return f(M(0, 1, 0, 0)); }, ['hours', '1시간', '1시간']);
    eq('59분 59초 → 59분', function () { return f(M(0, 0, 59, 59)); }, ['minutes', '59분', '59분']);
    eq('59분 → 59분', function () { return f(M(0, 0, 59, 0)); }, ['minutes', '59분', '59분']);
    eq('42분', function () { return f(M(0, 0, 42, 0)); }, ['minutes', '42분', '42분']);
    eq('정확히 1분 → 1분', function () { return f(60000); }, ['minutes', '1분', '1분']);
    eq('59초 999 → 59초', function () { return f(59999); }, ['seconds', '59초', '59초']);
    eq('42초', function () { return f(42000); }, ['seconds', '42초', '42초']);
    eq('42.5초도 42초 (내림)', function () { return f(42500); }, ['seconds', '42초', '42초']);
    eq('1초 → 1초', function () { return f(1000); }, ['seconds', '1초', '1초']);
    eq('1초 미만 → 0초', function () { return f(999); }, ['seconds', '0초', '0초']);
  });

  suite('리셋까지 문구 (formatUntilReset)', function () {
    eq('3일 → 리셋까지 3일', function () { return R.formatUntilReset(M(3, 0, 0, 0)); }, '리셋까지 3일');
    eq('3일 23시간 → 리셋까지 3일', function () { return R.formatUntilReset(M(3, 23, 0, 0)); }, '리셋까지 3일');
    eq('2일 → 리셋까지 2일', function () { return R.formatUntilReset(M(2, 0, 0, 0)); }, '리셋까지 2일');
    eq('47시간 59분 → 리셋까지 47시간', function () { return R.formatUntilReset(M(1, 23, 59, 0)); }, '리셋까지 47시간');
    eq('20시간 → 리셋까지 20시간', function () { return R.formatUntilReset(M(0, 20, 0, 0)); }, '리셋까지 20시간');
    eq('30분 → 리셋까지 30분', function () { return R.formatUntilReset(M(0, 0, 30, 0)); }, '리셋까지 30분');
    eq('42초 → 리셋까지 42초', function () { return R.formatUntilReset(42000); }, '리셋까지 42초');
  });

  suite('사이드바 묶음 단위 (bucketOf)', function () {
    function k(ms) { return R.bucketOf(ms).key; }
    eq('5시간 59분과 5시간 1분은 같은 묶음 H5', function () { return [k(M(0, 5, 59, 0)), k(M(0, 5, 1, 0))]; }, ['H5', 'H5']);
    eq('5시간 정각과 4시간 59분은 다른 묶음', function () { return [k(M(0, 5, 0, 0)), k(M(0, 4, 59, 0))]; }, ['H5', 'H4']);
    eq('47시간 59분은 H47, 48시간은 D2', function () { return [k(M(1, 23, 59, 0)), k(M(2, 0, 0, 0))]; }, ['H47', 'D2']);
    eq('2일 23시간 59분도 D2, 3일은 D3', function () { return [k(M(2, 23, 59, 0)), k(M(3, 0, 0, 0))]; }, ['D2', 'D3']);
    eq('59분 50초와 59분 10초는 같은 M59', function () { return [k(M(0, 0, 59, 50)), k(M(0, 0, 59, 10))]; }, ['M59', 'M59']);
    eq('42분과 59분은 다른 묶음', function () { return [k(M(0, 0, 42, 0)), k(M(0, 0, 59, 0))]; }, ['M42', 'M59']);
    eq('1시간은 H1, 1분은 M1', function () { return [k(M(0, 1, 0, 0)), k(60000)]; }, ['H1', 'M1']);
    eq('1분 미만은 같은 초: 42.1초와 42.9초는 S42', function () { return [k(42100), k(42900), k(41900)]; }, ['S42', 'S42', 'S41']);
    eq('라벨: D-2 / 5시간 / 42분 / 42초', function () { return [R.bucketOf(M(2, 20, 0, 0)).label, R.bucketOf(M(0, 5, 12, 0)).label, R.bucketOf(M(0, 0, 42, 0)).label, R.bucketOf(42000).label]; }, ['D-2', '5시간', '42분', '42초']);
    eq('sortMs는 급할수록 작다 (정렬하면 42초 < 5분 < 5시간 < D-2)', function () {
      var list = [M(2, 20, 0, 0), M(0, 5, 12, 0), 42000, M(0, 0, 5, 0)];
      return list.slice().sort(function (a, b) { return R.bucketOf(a).sortMs - R.bucketOf(b).sortMs; }).map(function (ms) { return R.bucketOf(ms).label; });
    }, ['42초', '5분', '5시간', 'D-2']);
  });

  /* ---------- 화면 갱신 시점 ---------- */
  suite('화면 갱신 시점 (msUntilTextChange, redrawDelay)', function () {
    eq('59분 30초 남음 → 분이 바뀌는 30초 뒤(+1ms)', function () { return R.msUntilTextChange(M(0, 0, 59, 30)); }, 30001);
    eq('42초 500ms 남음 → 500ms 뒤 초가 바뀐다(+1ms)', function () { return R.msUntilTextChange(42500); }, 501);
    eq('정확히 42초 남음 → 1ms 뒤', function () { return R.msUntilTextChange(42000); }, 1);
    eq('61초 남음 → 1분이 59초로 바뀌는 1001ms 뒤', function () { return R.msUntilTextChange(61000); }, 1001);
    eq('정확히 1분 남음 → 1ms 뒤 (59초로 바뀜)', function () { return R.msUntilTextChange(60000); }, 1);
    eq('5시간 12분 30초 남음 → 30001ms', function () { return R.msUntilTextChange(M(0, 5, 12, 30)); }, 30001);
    eq('48시간 30분 남음(D-2 구간) → 시간 단위: 30분 + 1ms', function () { return R.msUntilTextChange(M(2, 0, 30, 0)); }, 1800001);
    eq('48시간 1ms 남음 → 2ms 뒤(47시간 59분 59초 999ms)에 47시간 59분으로 바뀐다', function () { return R.msUntilTextChange(M(2, 0, 0, 0) + 1); }, 2);
    eq('3일 5시간 10분 남음 → 10분 + 1ms', function () { return R.msUntilTextChange(M(3, 5, 10, 0)); }, 600001);
    eq('리셋까지 500ms 남음 → 리셋 시각(500ms)을 넘지 않는다', function () { return R.msUntilTextChange(500); }, 500);
    eq('리셋까지 0ms → 0', function () { return R.msUntilTextChange(0); }, 0);
    eq('1회(null) → Infinity', function () { return R.msUntilTextChange(null); }, Infinity);
    eq('실제로 그 시간만큼 지나면 글자가 바뀐다 (여러 값)', function () {
      return [M(0, 5, 12, 30), 42500, 61000, M(0, 0, 59, 30), M(2, 0, 30, 0), M(3, 5, 10, 0), 60000, M(2, 0, 0, 0) + 1].map(function (ms) {
        var before = R.formatRemaining(ms).text;
        var after = R.formatRemaining(ms - R.msUntilTextChange(ms)).text;
        var justBefore = R.formatRemaining(ms - R.msUntilTextChange(ms) + 1).text;
        return before !== after || R.msUntilTextChange(ms) === ms ? (justBefore === before || R.msUntilTextChange(ms) === 1) : false;
      }).every(Boolean);
    }, true);
    eq('redrawDelay: 목록이 비면 60초', function () { return R.redrawDelay([]); }, 60000);
    eq('redrawDelay: 1회(null)만 있으면 60초', function () { return R.redrawDelay([null]); }, 60000);
    eq('redrawDelay: 시간 단위만 있으면 60초 상한 (5시간 12분 30초 → 30001ms)', function () { return R.redrawDelay([M(0, 5, 12, 30)]); }, 30001);
    eq('redrawDelay: 3일 5시간 30분 남음(다음 변화가 30분 뒤)이면 60초로 줄인다', function () { return R.redrawDelay([M(3, 5, 30, 0)]); }, 60000);
    eq('redrawDelay: 정각(3일 5시간 정확히)이면 1ms 뒤에 바뀐다', function () { return R.redrawDelay([M(3, 5, 0, 0)]); }, 1);
    eq('redrawDelay: 초가 보이는 값이 있으면 그 초가 바뀔 때 (42.5초 → 501ms)', function () { return R.redrawDelay([M(0, 5, 12, 30), 42500, null]); }, 501);
    eq('redrawDelay: 리셋이 곧이면 리셋 시각', function () { return R.redrawDelay([300, M(0, 5, 12, 30)]); }, 300);
    eq('redrawDelay: 두 번째 인자로 상한을 늘리거나 줄일 수 없다 (항상 60초 상한)', function () { return [R.redrawDelay([], 120000), R.redrawDelay([M(3, 5, 30, 0)], 120000), R.redrawDelay([M(3, 5, 30, 0)], 5000)]; }, [60000, 60000, 60000]);
    eq('redrawDelay: 지났으면 최소 1ms', function () { return R.redrawDelay([0]); }, 1);
  });

  /* ---------- 실행과 화면 ---------- */
  function runAll() {
    out.textContent = '';
    var total = 0, passed = 0, failures = [];
    window.__cases = [];
    suites.forEach(function (s) {
      cur = { name: s.name, cases: [] };
      try { s.fn(); } catch (e) { record('(묶음 실행 중 예외)', false, undefined, undefined, e); }
      cur.cases.forEach(function (c) { window.__cases.push({ suite: s.name, name: c.name, src: c.src, expected: show(c.expected) }); });
      var p = cur.cases.filter(function (c) { return c.pass; }).length;
      total += cur.cases.length;
      passed += p;

      var d = document.createElement('details');
      d.className = 'suite';
      d.open = p !== cur.cases.length;
      var sm = document.createElement('summary');
      var nm = document.createElement('span'); nm.className = 'suite-name'; nm.textContent = s.name;
      var bd = document.createElement('span'); bd.className = 'badge' + (p === cur.cases.length ? '' : ' fail'); bd.textContent = p + ' / ' + cur.cases.length;
      sm.appendChild(nm); sm.appendChild(bd); d.appendChild(sm);
      var ul = document.createElement('ul'); ul.className = 'cases';
      cur.cases.forEach(function (c) {
        var li = document.createElement('li');
        li.className = c.pass ? 'pass' : 'fail';
        var mark = document.createElement('span'); mark.className = 'mark'; mark.textContent = c.pass ? '✓' : '✗';
        li.appendChild(mark); li.appendChild(document.createTextNode(c.name));
        if (!c.pass) {
          failures.push(s.name + ' › ' + c.name);
          var pre = document.createElement('pre');
          pre.textContent = '기대값: ' + show(c.expected) + '\n실제값: ' + (c.err ? '예외 — ' + (c.err && c.err.message) : show(c.actual));
          li.appendChild(pre);
        }
        ul.appendChild(li);
      });
      d.appendChild(ul);
      out.appendChild(d);
    });

    var failed = total - passed;
    document.getElementById('sum-text').textContent = '전체 ' + total + '개 중 통과 ' + passed + ' · 실패 ' + failed;
    var fb = document.getElementById('sum-fail');
    fb.hidden = failed === 0;
    fb.className = 'badge fail';
    fb.textContent = '실패 ' + failed;
    document.title = (failed ? '(실패 ' + failed + ') ' : '') + 'reset.js 테스트';
    var info = R.nowInfo();
    document.getElementById('nowline').textContent = '현재 시각 ' + fmtDate(info.date) + (info.isTest ? ' (테스트 시각)' : '') + (info.error ? ' · ' + info.error : '');
    window.__testResult = { total: total, passed: passed, failed: failed, failures: failures };
  }

  document.getElementById('rerun').addEventListener('click', runAll);
  window.runAll = runAll;
  runAll();
})();
</script>
